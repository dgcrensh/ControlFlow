name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    name: ControlFlowCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Packages/ControlFlowCore

  schema:
    name: File format schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "jsonschema>=4.18"
      - run: python Schema/validate.py

  app-build:
    name: App build (iPad Simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version && xcodebuild -showsdks
      - name: Build
        run: |
          xcodebuild build \
            -project ControlFlow.xcodeproj \
            -scheme ControlFlow \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
